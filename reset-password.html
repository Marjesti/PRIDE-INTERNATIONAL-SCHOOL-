<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">RM</div>
      <p class="eyebrow">Account recovery</p>
      <h1>Set a new password</h1>
      <p class="subtitle">Choose a new password for your account.</p>

      <div id="error-banner" class="error-banner"></div>
      <div id="success-banner" class="error-banner" style="background:#E8F3EA; color:#3A7D44;"></div>

      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Set new password</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script>
    // Supabase reads the recovery token from the URL automatically and
    // establishes a temporary session for this one action.
    document.getElementById('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errEl = document.getElementById('error-banner');
      const okEl = document.getElementById('success-banner');
      errEl.classList.remove('visible'); okEl.classList.remove('visible');

      const button = document.getElementById('submit-btn');
      button.disabled = true;
      button.textContent = 'Saving...';

      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.updateUser({ password });

      button.disabled = false;
      button.textContent = 'Set new password';

      if (error) {
        errEl.textContent = error.message;
        errEl.classList.add('visible');
        return;
      }
      okEl.textContent = 'Password updated. Redirecting to sign in...';
      okEl.classList.add('visible');
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    });
  </script>
</body>
</html>
