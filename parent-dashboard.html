<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent dashboard</title>
<link rel="stylesheet" href="css/style.css?v=2">
<link rel="stylesheet" href="css/dashboard.css?v=3">
<style>
  .parent-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; background: var(--navy); color: #fff;
  }
  .parent-topbar .school-line { font-size: 13px; color: #C9D0E0; }
  .parent-topbar button {
    background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff;
    padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  }
  .parent-body { max-width: 800px; margin: 0 auto; padding: 24px 18px 60px; }
</style>
</head>
<body>
  <div class="parent-topbar">
    <div>
      <div style="font-weight:700;" id="parent-name">Loading...</div>
      <div class="school-line" id="school-name"></div>
    </div>
    <button onclick="signOutParent()">Sign out</button>
  </div>
  <div class="parent-body" id="page-body"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/parent-dashboard.js?v=1"></script>
</body>
</html>
